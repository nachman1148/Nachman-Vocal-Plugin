\
name: Build NAHMAN VOCAL SUITE VST3

on:
  workflow_dispatch:
  push:
    paths:
      - "NahmanVocalSuite/**"
      - ".github/workflows/build-vst3.yml"

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-2022
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Build VST3 and Standalone
        shell: pwsh
        run: |
          Set-ExecutionPolicy -Scope Process Bypass
          ./NahmanVocalSuite/BUILD_WINDOWS.ps1

      - name: Upload VST3 and Standalone artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NahmanVocalSuite-Windows-64bit
          path: |
            NahmanVocalSuite/build-windows/NahmanVocalSuite_artefacts/Release/VST3/**
            NahmanVocalSuite/build-windows/NahmanVocalSuite_artefacts/Release/Standalone/**
          if-no-files-found: error
          compression-level: 6
